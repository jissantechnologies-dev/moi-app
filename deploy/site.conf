# Served inside the nginx container; Traefik terminates TLS in front of it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # expo-sqlite keeps the database in the browser's OPFS, which is only
    # reachable from a cross-origin-isolated page. Without these two headers the
    # app silently falls back to localStorage — the fragile store we moved off.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # No `types` block here on purpose: it would replace the inherited MIME map
    # rather than extend it. nginx has mapped .wasm to application/wasm since
    # 1.21.1, which is what the SQLite module needs to instantiate.

    # Bundle filenames carry a content hash, so they can be cached hard.
    location /_expo/ {
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location /assets/ {
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    # index.html must not be cached, or a deploy leaves browsers asking for
    # bundle filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    gzip_min_length 1024;
}
